<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b7c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="980" height="560" fill="#fafbfc" rx="8"/>

  <!-- title -->
  <text x="490" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#1f2937">系统架构</text>

  <!-- user -->
  <rect x="40" y="100" width="130" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#1e40af">用户 / 浏览器</text>

  <!-- gateway -->
  <rect x="260" y="100" width="150" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="335" y="125" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#14532d">FastAPI 网关</text>
  <text x="335" y="143" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#166534">api_server.py</text>

  <!-- agent -->
  <rect x="500" y="90" width="190" height="76" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#581c87">LangGraph ReAct Agent</text>
  <text x="595" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b21a8">agent.py</text>

  <!-- MCP tools (right side, stacked) -->
  <rect x="770" y="200" width="150" height="64" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="845" y="225" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#7c2d12">天气 MCP</text>
  <text x="845" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9a3412">weather_server.py</text>

  <rect x="770" y="290" width="150" height="64" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="845" y="315" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#7c2d12">地图 MCP</text>
  <text x="845" y="335" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9a3412">map_server.py</text>

  <rect x="770" y="380" width="150" height="64" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="845" y="405" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#7c2d12">高铁 MCP</text>
  <text x="845" y="425" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9a3412">train_server.py</text>

  <!-- data sources (taller body so text isn't clipped by ellipses) -->
  <path d="M520,216 a55,16 0 0,1 110,0 v50 a55,16 0 0,1 -110,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="575" cy="216" rx="55" ry="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="575" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155">Open-Meteo</text>
  <text x="575" y="260" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">默认 / 免 Key</text>

  <path d="M520,306 a55,16 0 0,1 110,0 v50 a55,16 0 0,1 -110,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="575" cy="306" rx="55" ry="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="575" y="336" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155">高德 API</text>

  <path d="M520,396 a55,16 0 0,1 110,0 v50 a55,16 0 0,1 -110,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="575" cy="396" rx="55" ry="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="575" y="423" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155">本地高铁路网</text>
  <text x="575" y="440" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">知识图谱</text>

  <!-- static frontend -->
  <rect x="260" y="200" width="150" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="335" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#78350f">静态前端</text>
  <text x="335" y="238" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e">static/index.html</text>

  <!-- arrows -->
  <!-- user -> gateway -->
  <line x1="170" y1="128" x2="260" y2="128" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="193" y="110" width="46" height="16" rx="3" fill="#fafbfc"/>
  <text x="216" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4b5563">HTTP /chat</text>

  <!-- gateway -> agent -->
  <line x1="410" y1="128" x2="500" y2="128" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="108" width="72" height="16" rx="3" fill="#fafbfc"/>
  <text x="456" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4b5563">多轮历史 / 省略补全</text>

  <!-- gateway -> frontend -->
  <line x1="335" y1="156" x2="335" y2="200" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="342" y="170" width="16" height="16" rx="3" fill="#fafbfc"/>
  <text x="350" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4b5563">/</text>

  <!-- agent -> MCP tools (right side) -->
  <line x1="690" y1="130" x2="770" y2="232" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="130" x2="770" y2="322" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="130" x2="770" y2="412" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- shared stdio label -->
  <rect x="720" y="150" width="42" height="18" rx="3" fill="#fafbfc"/>
  <text x="741" y="163" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#4b5563">stdio ×3</text>

  <!-- MCP -> data sources (left side) -->
  <line x1="770" y1="232" x2="630" y2="241" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="322" x2="630" y2="331" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="412" x2="630" y2="421" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="490" y="520" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6b7280">Agent 通过 stdio 拉起 3 个 MCP Server 子进程；天气默认走 Open-Meteo（免费免 Key），可选 OpenWeather</text>
</svg>